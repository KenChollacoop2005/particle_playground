<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Playground</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <canvas id="canvas"></canvas>

  <div id="ui">
    <div id="mode-switcher">
      <button class="mode-btn active" data-mode="boids">Boids</button>
      <button class="mode-btn" data-mode="slime">Slime Mold</button>
      <button class="mode-btn" data-mode="audio">Audio Reactive</button>
    </div>

    <div id="controls">
      <!-- Populated per-mode by js/modes/*.js -->
    </div>

    <button id="ui-toggle" title="Show/hide controls">–</button>
  </div>

  <div id="mode-title">Boids</div>

  <script src="js/modes/boids.js"></script>
  <script src="js/modes/slime.js"></script>
  <script src="js/modes/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
