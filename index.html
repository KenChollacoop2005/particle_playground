<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Playground</title>
<meta name="description" content="Three real-time particle simulations (flocking, slime mold, audio-reactive) on one shared canvas engine. Vanilla JS, no dependencies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <canvas id="canvas" aria-label="Simulation canvas. Drag or click to interact."></canvas>

  <!-- Instrument frame: corner brackets only, purely decorative -->
  <div class="frame-corner tl" aria-hidden="true"></div>
  <div class="frame-corner tr" aria-hidden="true"></div>
  <div class="frame-corner bl" aria-hidden="true"></div>
  <div class="frame-corner br" aria-hidden="true"></div>

  <header id="title-block">
    <div class="eyebrow">Particle Playground</div>
    <h1 id="mode-title">Boids</h1>
    <div class="title-meta">
      <span id="mode-index">MODE 01 / 03</span>
      <span id="paused-badge" hidden>PAUSED</span>
    </div>
  </header>

  <div id="ui">
    <div class="ui-top">
      <nav id="mode-switcher" aria-label="Simulation mode">
        <!-- Buttons generated by js/main.js from MODE_ORDER -->
      </nav>
      <button id="ui-toggle" type="button" title="Show/hide controls (C)" aria-controls="controls" aria-expanded="true">–</button>
    </div>

    <section id="controls" aria-label="Mode controls">
      <!-- Populated per-mode by js/modes/*.js -->
    </section>
  </div>

  <aside id="hud" aria-label="Performance readout">
    <div class="hud-head">
      <span>Readout</span>
      <button id="hud-close" type="button" title="Hide readout (H)" aria-label="Hide readout">×</button>
    </div>
    <div id="hud-body" aria-live="off"></div>
  </aside>

  <div id="key-hints" aria-hidden="true">
    <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> mode</span>
    <span><kbd>space</kbd> pause</span>
    <span><kbd>R</kbd> reset</span>
    <span><kbd>H</kbd> readout</span>
    <span><kbd>C</kbd> controls</span>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/modes/boids.js"></script>
  <script src="js/modes/slime.js"></script>
  <script src="js/modes/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
